name: playwright artifacts
on:
  push:
    branches: [gate]
  pull_request:
    branches: [gate]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
            node-version: 24
            cache: npm

      - name: install dependencies
        run: npm ci

      - name: run linting
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    environment: develop
    env:
        BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
            node-version: 24
            cache: npm

      - name: install dependencies
        run: npm ci

      - name: install browser
        run: npx playwright install --with-deps chromium

      - name: run tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
